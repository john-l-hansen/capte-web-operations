<!--
  Banner row for the v1.1 "New email" signature template (not the Reply variant).
  Replace {{OFFICE}} with la, fr or nl, and {{BANNER_ALT}} with the office's fixed label:
    la: Capte Technologies: learn more at capte.co
    fr: Capte Technologies : en savoir plus sur capte.co
    nl: Capte Technologies: meer informatie op capte.co
  Size follows the Webflow "Signature Campaigns" collection: 1200 x 400 file (@2x), shown at 600 x 200.
-->
<tr>
  <td style="padding:16px 0 0 0;">
    <a href="https://sig.capte.co/go?o={{OFFICE}}" target="_blank">
      <img src="https://sig.capte.co/banner.png?o={{OFFICE}}" referrerpolicy="no-referrer" width="600" height="200"
           alt="{{BANNER_ALT}}" style="display:block;border:0;width:600px;max-width:100%;height:auto;">
    </a>
  </td>
</tr>

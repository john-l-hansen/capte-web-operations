<!--
  Banner row for the v1.1 "New email" signature template (not the Reply variant).
  Replace {{OFFICE}} with la, fr or nl, and {{BANNER_ALT}} with the office's fixed label:
    la: Capte Technologies: latest news and events
    fr: Capte Technologies : actualités et événements
    nl: Capte Technologies: nieuws en evenementen
  Size follows the Webflow "Signature Campaigns" collection: 600 x 160 file, shown at 300 x 80.
-->
<tr>
  <td style="padding:16px 0 0 0;">
    <a href="https://sig.capte.co/go?o={{OFFICE}}" target="_blank">
      <img src="https://sig.capte.co/banner.png?o={{OFFICE}}" width="300" height="80"
           alt="{{BANNER_ALT}}" style="display:block;border:0;width:300px;height:80px;">
    </a>
  </td>
</tr>

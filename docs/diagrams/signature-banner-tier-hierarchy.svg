<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 720" width="760" height="720" style="background:#FFFFFF; font-family:'Roboto',-apple-system,BlinkMacSystemFont,Arial,sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#001384" flood-opacity="0.06"/>
    </filter>
    <filter id="top-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FC5522" flood-opacity="0.12"/>
    </filter>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#001384" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="760" height="720" fill="#FFFFFF"/>

  <!-- Header -->
  <g transform="translate(40, 36)">
    <rect x="0" y="0" width="138" height="22" rx="4" fill="#DCEDFF"/>
    <text x="69" y="15" fill="#001384" font-size="11" font-weight="700" letter-spacing="0.5" text-anchor="middle">EDGE ROUTER LOGIC</text>
    <text x="0" y="48" fill="#001384" font-size="22" font-weight="800">Dynamic Signature Banner — 4-Tier Hierarchy</text>
    <text x="0" y="70" fill="#5C6470" font-size="13">Edge resolution lifecycle on sig.capte.co (Webflow CMS &rarr; Cloudflare Worker &rarr; Email Client)</text>
  </g>

  <!-- ==================== TIER 1: ACTIVE EVENT ==================== -->
  <g transform="translate(40, 128)" filter="url(#top-shadow)">
    <!-- Container -->
    <rect width="680" height="98" rx="10" fill="#FFFFFF" stroke="#FC5522" stroke-width="2"/>
    <path d="M 0 10 Q 0 0 10 0 L 670 0 Q 680 0 680 10 L 680 14 L 0 14 Z" fill="#FC5522"/>
    
    <!-- Badge -->
    <rect x="20" y="26" width="168" height="22" rx="4" fill="#FFF1EC"/>
    <text x="104" y="41" fill="#FC5522" font-size="11" font-weight="700" letter-spacing="0.4" text-anchor="middle">TIER 1 • HIGHEST PRIORITY</text>
    
    <!-- Title & Description -->
    <text x="200" y="43" fill="#0F0F11" font-size="16" font-weight="700">Active Event / Campaign Slot</text>
    <text x="20" y="74" fill="#3D4551" font-size="13">
      <tspan font-weight="600">Trigger:</tspan> Date-window active (Start &le; Now &lt; End) &amp; Is Active = ON. Overrides all evergreen banners.
    </text>
    <text x="20" y="93" fill="#5C6470" font-size="12">
      <tspan font-weight="600">Use Cases:</tspan> 10-Year Anniversary, APTA Expo, InnoTrans • Supports Co-Founder A/B variants (<tspan font-family="monospace" fill="#001384">?v=a</tspan> / <tspan font-family="monospace" fill="#001384">?v=b</tspan>)
    </text>
  </g>

  <!-- Connector 1 -> 2 -->
  <g transform="translate(380, 226)">
    <line x1="0" y1="0" x2="0" y2="28" stroke="#001384" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
    <rect x="12" y="6" width="146" height="18" rx="3" fill="#F2F4FC"/>
    <text x="85" y="19" fill="#001384" font-size="10" font-weight="600" text-anchor="middle">If no event active / expired</text>
  </g>

  <!-- ==================== TIER 2: LOCATION EVERGREEN ==================== -->
  <g transform="translate(40, 260)" filter="url(#card-shadow)">
    <!-- Container -->
    <rect width="680" height="96" rx="10" fill="#FFFFFF" stroke="#001384" stroke-width="1.5"/>
    <path d="M 0 10 Q 0 0 10 0 L 670 0 Q 680 0 680 10 L 680 14 L 0 14 Z" fill="#001384"/>
    
    <!-- Badge -->
    <rect x="20" y="26" width="168" height="22" rx="4" fill="#DCEDFF"/>
    <text x="104" y="41" fill="#001384" font-size="11" font-weight="700" letter-spacing="0.4" text-anchor="middle">TIER 2 • LOCATION DEFAULT</text>
    
    <!-- Title & Description -->
    <text x="200" y="43" fill="#0F0F11" font-size="16" font-weight="700">Location Evergreen Slot</text>
    <text x="20" y="74" fill="#3D4551" font-size="13">
      <tspan font-weight="600">Trigger:</tspan> Is Evergreen = ON &amp; Target Office matches request (<tspan font-family="monospace" fill="#001384">?o=la</tspan>, <tspan font-family="monospace" fill="#001384">?o=fr</tspan>, or <tspan font-family="monospace" fill="#001384">?o=nl</tspan>).
    </text>
    <text x="20" y="93" fill="#5C6470" font-size="12">
      <tspan font-weight="600">Use Cases:</tspan> Dedicated regional branding for Los Angeles HQ, Versailles (FR), or Amsterdam (NL).
    </text>
  </g>

  <!-- Connector 2 -> 3 -->
  <g transform="translate(380, 356)">
    <line x1="0" y1="0" x2="0" y2="28" stroke="#001384" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
    <rect x="12" y="6" width="160" height="18" rx="3" fill="#F2F4FC"/>
    <text x="92" y="19" fill="#001384" font-size="10" font-weight="600" text-anchor="middle">If office has no evergreen banner</text>
  </g>

  <!-- ==================== TIER 3: VANILLA ALL-OFFICES ==================== -->
  <g transform="translate(40, 390)" filter="url(#card-shadow)">
    <!-- Container -->
    <rect width="680" height="96" rx="10" fill="#FFFFFF" stroke="#093AEC" stroke-width="1.2"/>
    <path d="M 0 10 Q 0 0 10 0 L 670 0 Q 680 0 680 10 L 680 14 L 0 14 Z" fill="#093AEC"/>
    
    <!-- Badge -->
    <rect x="20" y="26" width="168" height="22" rx="4" fill="#F2F4FC"/>
    <text x="104" y="41" fill="#093AEC" font-size="11" font-weight="700" letter-spacing="0.4" text-anchor="middle">TIER 3 • BASE EVERGREEN</text>
    
    <!-- Title & Description -->
    <text x="200" y="43" fill="#0F0F11" font-size="16" font-weight="700">Vanilla / All-Offices Evergreen Slot</text>
    <text x="20" y="74" fill="#3D4551" font-size="13">
      <tspan font-weight="600">Trigger:</tspan> Is Evergreen = ON &amp; Target Office = &quot;All Offices&quot; (or unknown office query parameter).
    </text>
    <text x="20" y="93" fill="#5C6470" font-size="12">
      <tspan font-weight="600">Use Cases:</tspan> Universal company-wide brand message (e.g. &quot;Capte IoT &amp; Telemetry Solutions&quot; &rarr; capte.co).
    </text>
  </g>

  <!-- Connector 3 -> 4 -->
  <g transform="translate(380, 486)">
    <line x1="0" y1="0" x2="0" y2="28" stroke="#001384" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
    <rect x="12" y="6" width="170" height="18" rx="3" fill="#F2F4FC"/>
    <text x="97" y="19" fill="#001384" font-size="10" font-weight="600" text-anchor="middle">If all items inactive / unpublished</text>
  </g>

  <!-- ==================== TIER 4: TRANSPARENT PIXEL ==================== -->
  <g transform="translate(40, 520)" filter="url(#card-shadow)">
    <!-- Container -->
    <rect width="680" height="96" rx="10" fill="#FFFFFF" stroke="#B0B6BF" stroke-width="1.2"/>
    <path d="M 0 10 Q 0 0 10 0 L 670 0 Q 680 0 680 10 L 680 14 L 0 14 Z" fill="#7B8491"/>
    
    <!-- Badge -->
    <rect x="20" y="26" width="168" height="22" rx="4" fill="#F4F5F7"/>
    <text x="104" y="41" fill="#5C6470" font-size="11" font-weight="700" letter-spacing="0.4" text-anchor="middle">TIER 4 • FAIL-CLOSED SAFETY</text>
    
    <!-- Title & Description -->
    <text x="200" y="43" fill="#0F0F11" font-size="16" font-weight="700">Fail-Closed Transparent Pixel (1&times;1 GIF)</text>
    <text x="20" y="74" fill="#3D4551" font-size="13">
      <tspan font-weight="600">Behavior:</tspan> Returns HTTP 200 with a 35-byte 1&times;1 transparent GIF. Click redirects safely to capte.co.
    </text>
    <text x="20" y="93" fill="#5C6470" font-size="12">
      <tspan font-weight="600">Guarantee:</tspan> Zero broken image icons, zero red &quot;X&quot; boxes, and zero layout collapse across all email clients.
    </text>
  </g>

  <!-- Footer / Spec Notes -->
  <g transform="translate(40, 646)">
    <rect width="680" height="42" rx="6" fill="#F2F4FC"/>
    <text x="20" y="26" fill="#001384" font-size="12" font-weight="600">Asset Specification:</text>
    <text x="145" y="26" fill="#3D4551" font-size="12">1200 &times; 400 px file (uploaded to CMS) &rarr; Rendered at 600 &times; 200 px (Retina 2x) &bull; Top orange accent line: #FC5522</text>
  </g>
</svg>